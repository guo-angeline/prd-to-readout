[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prd-to-readout"
dynamic = ["version"]
description = "Turn a PRD into a self-healing, local analytics readout. Hypotheses to daily insights, no cloud warehouse."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "prd-to-readout contributors" }]
keywords = ["analytics", "prd", "llm", "agent", "duckdb", "dbt", "product"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "litellm>=1.40",
    "duckdb>=1.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "plotext>=5.2",
    "scipy>=1.11",
    "numpy>=1.24",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/guo-angeline/prd-to-readout"
Repository = "https://github.com/guo-angeline/prd-to-readout"

[project.scripts]
prd-to-readout = "prd_to_readout.cli:app"
p2r = "prd_to_readout.cli:app"

[tool.hatch.version]
path = "src/prd_to_readout/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/prd_to_readout"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Generated artifacts reference external SDKs (e.g. `analytics`); don't lint them.
extend-exclude = ["examples/*_run"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Typer uses function calls (typer.Option/Argument) in defaults by design.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
